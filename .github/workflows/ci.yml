name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  typecheck:
    name: ci / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  tests:
    name: ci / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage-free so failures isolate to logic, not the coverage gate.
      - name: Unit tests
        run: |
          node --import ./packages/server/node_modules/tsx/dist/loader.mjs \
            --test packages/server/test/*.test.ts

  coverage:
    name: ci / coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Floor waived at 50% lines; spec target is 90 (specs/testing/unit-tests.md) —
      # raise as agent/sandbox/mcp gain coverage. Measured % prints via --test-reporter output below.
      - name: Tests with V8 coverage
        id: cov
        run: |
          node --import ./packages/server/node_modules/tsx/dist/loader.mjs \
            --experimental-test-coverage --test-coverage-include='packages/server/src/**' \
            --test-coverage-lines=50 --test packages/server/test/*.test.ts 2>&1 | tee cov.log
      - name: Report measured coverage
        if: always()
        run: |
          PCT=$(grep "all files" cov.log | grep -oE "[0-9]+\.[0-9]+" | head -1)
          echo "measured line coverage: ${PCT:-unknown}%" >> "$GITHUB_STEP_SUMMARY"
