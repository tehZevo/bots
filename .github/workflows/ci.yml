name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  typecheck:
    name: ci / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  tests:
    name: ci / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage-free so failures isolate to logic, not the coverage gate.
      - name: Unit tests
        run: |
          node --import ./packages/server/node_modules/tsx/dist/loader.mjs \
            --test packages/server/test/*.test.ts

  coverage:
    name: ci / coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Server floor 70% lines; spec target is 90 (specs/testing/unit-tests.md) —
      # raise as agent/sandbox/mcp gain coverage. Measured % prints via --test-reporter output below.
      - name: Tests with V8 coverage
        id: cov
        run: |
          node --import ./packages/server/node_modules/tsx/dist/loader.mjs \
            --experimental-test-coverage --test-coverage-include='packages/server/src/**' \
            --test-coverage-lines=70 --test packages/server/test/*.test.ts 2>&1 | tee cov.log
      - name: Report measured coverage
        if: always()
        run: |
          PCT=$(grep "all files" cov.log | grep -oE "[0-9]+\.[0-9]+" | head -1)
          echo "measured line coverage (server): ${PCT:-unknown}%" >> "$GITHUB_STEP_SUMMARY"
      # Web suite is spec'd but not landed yet: measured report-only, no floor (specs/testing/ci.md).
      - name: Web coverage (report only)
        if: always()
        run: |
          shopt -s nullglob
          files=(packages/web/test/*.test.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "web suite not enabled yet — no test files" >> "$GITHUB_STEP_SUMMARY"
          else
            node --import ./packages/server/node_modules/tsx/dist/loader.mjs \
              --experimental-test-coverage --test-coverage-include='packages/web/src/**' \
              --test "${files[@]}" 2>&1 | tee cov-web.log || true
            PCT=$(grep "all files" cov-web.log | grep -oE "[0-9]+\.[0-9]+" | head -1)
            echo "measured line coverage (web, report only): ${PCT:-unknown}%" >> "$GITHUB_STEP_SUMMARY"
          fi
