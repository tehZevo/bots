name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Target is 90% per specs/testing/unit-tests.md; waived until logic-heavy
      # modules (agent, sandbox, mcp) gain coverage — raise as it climbs.
      - run: pnpm test
